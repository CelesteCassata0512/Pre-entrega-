<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto- Primero y Gol Store</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="./index.html"><span class="texto-italica">Primero y Gol</span> Store</a></div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form class="form-contacto" action="" method="POST">
          
            <div class="grupo-input">
            <label for="nombre"> Nombre y Apellido: </label>
            <input id="nombre" type="nombre" name="nombre" />
          </div>
          
            <div class="grupo-input">
            <label for="email"> Correo electrónico: </label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje"> Mensaje: </label>
            <textarea id="mensaje" name="message"></textarea>
          </div>
          
          <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      
       <nav>
        <ul class="footer-list-social-media">
          <p>También podés contactarnos por nuestras redes</p>  
          <li><img src="../img/whatsapp.PNG" alt="logo-whatsapp" /></li>
          <li><img src="../img/instagram.PNG" alt="logo-instagram" /></li>
          <li><img src="../img/tiktok.PNG" alt="logo-tiktok" /></li>
          <li><img src="../img/facebook.PNG" alt="logo-facebook" /></li>
        </ul>
      </nav>
      <p>Sitio web creado por M. Celeste Cassata</p>
    </footer>
  </body>
</html>
